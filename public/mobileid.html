<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Вход по номеру телефона — Iceberg</title>
    <style>
        :root {
            --primary: #000cff;
            --primary-dark: #0009cc;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --error: #ef4444;
            --bg: #ffffff;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
        }
        .wrap {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 20px;
            max-width: 460px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            margin: 0 0 28px;
            line-height: 1.4;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            height: 54px;
            padding: 0 16px;
            font-size: 18px;
            font-weight: 600;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }
        input:focus { border-color: var(--primary); }
        input:disabled { background: #f3f4f6; color: var(--muted); }
        .field { margin-bottom: 18px; }
        .hidden { display: none !important; }
        button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 27px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            margin-top: 8px;
        }
        button:active { background: var(--primary-dark); }
        button:disabled { opacity: 0.5; cursor: default; }
        .status {
            min-height: 20px;
            font-size: 14px;
            text-align: center;
            margin-top: 18px;
            line-height: 1.4;
        }
        .status.error { color: var(--error); }
        .status.info { color: var(--muted); }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 24px;
            line-height: 1.5;
        }
        /* Компактный режим внутри WebView приложения (?embed=1) */
        body.embed,
        body.embed html {
            height: auto;
            min-height: 0;
            overflow: hidden;
        }
        body.embed .wrap {
            min-height: 0;
            justify-content: flex-start;
            padding: 0 16px 12px;
        }
        body.embed .page-title,
        body.embed .page-subtitle,
        body.embed .hint {
            display: none;
        }
        body.embed .field:first-of-type {
            margin-top: 0;
        }
        body.embed .field {
            margin-bottom: 14px;
        }
        body.embed button {
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 class="page-title">Вход по номеру телефона</h1>
        <p class="page-subtitle subtitle">
            Подтвердите номер телефона — авторизация пройдёт автоматически
            или по коду из SMS.
        </p>

        <div id="phoneStep">
            <div class="field">
                <label for="phone">Номер телефона</label>
                <input id="phone" type="tel" inputmode="tel"
                       placeholder="+7 (___) ___-__-__"
                       autocomplete="tel" />
            </div>
            <button id="startBtn" disabled>Подтвердить</button>
        </div>

        <div id="otpStep" class="hidden">
            <div class="field">
                <label for="otp">Код из SMS</label>
                <input id="otp" type="tel" inputmode="numeric"
                       maxlength="6" placeholder="0000" autocomplete="one-time-code" />
            </div>
            <button id="otpBtn">Подтвердить код</button>
        </div>

        <div id="status" class="status info"></div>

        <p class="hint">
            Нажимая «Подтвердить», вы соглашаетесь с обработкой номера телефона
            для авторизации через сервис SMS Aero.
        </p>
    </div>

    <!--
      ВАЖНО: подключите JS SDK MobileID от SMS Aero.
      Точный URL скрипта возьмите в личном кабинете SMS Aero
      (раздел «Мобильная авторизация»). Скрипт можно:
        - положить рядом с этой страницей как /mobileid-sdk.js, ЛИБО
        - указать CDN-URL, выданный SMS Aero.
      Переопределить источник можно query-параметром ?sdk=<url>.
    -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('embed') === '1') {
                document.body.classList.add('embed');
            }

            var sdkSrc = params.get('sdk') || '/mobileid-sdk.js';
            var s = document.createElement('script');
            s.src = sdkSrc;
            s.async = true;
            s.onerror = function () {
                var message = 'Не удалось загрузить форму входа по номеру. '
                    + 'Проверьте подключение к интернету и попробуйте ещё раз.';
                showStatus(message, 'error');
                postToApp({ type: 'error', code: 'SDK_LOAD_FAILED', message: message, userMessage: message });
            };
            s.onload = init;
            document.head.appendChild(s);
        })();

        var mid = null;
        var currentPhone = '';
        var pendingTimer = null;
        var pendingStartedAt = 0;
        var errorReported = false;

        var els = {
            phone: document.getElementById('phone'),
            startBtn: document.getElementById('startBtn'),
            phoneStep: document.getElementById('phoneStep'),
            otp: document.getElementById('otp'),
            otpBtn: document.getElementById('otpBtn'),
            otpStep: document.getElementById('otpStep'),
            status: document.getElementById('status'),
        };

        function showStatus(text, kind) {
            els.status.textContent = text || '';
            els.status.className = 'status ' + (kind || 'info');
        }

        // Ошибки приходят от SDK, нашего backend и от сети в разном виде
        // ({status, data}, Error, строка). Пользователю показываем только
        // понятный текст с подсказкой, что делать дальше.
        var ERROR_BY_CODE = {
            INVALID_PHONE: 'Проверьте номер телефона: он должен начинаться с +7 и содержать 11 цифр.',
            INIT_FAILED: 'Не удалось подключиться к сервису входа по номеру. Попробуйте ещё раз через минуту.',
            START_FAILED: 'Не удалось начать проверку номера. Проверьте номер и попробуйте снова.',
            START_EXCEPTION: 'Не удалось начать проверку номера. Проверьте номер и попробуйте снова.',
            OTP_FAILED: 'Не удалось отправить код. Проверьте связь и попробуйте снова.'
        };

        var ERROR_BY_STATUS = {
            400: 'Проверьте номер телефона и попробуйте снова.',
            401: 'Сервис не подтвердил запрос. Начните проверку заново.',
            403: 'Сервис не подтвердил запрос. Начните проверку заново.',
            404: 'Вход по номеру телефона сейчас недоступен. Попробуйте войти по email и паролю.',
            409: 'Проверка для этого номера уже идёт. Подождите немного и попробуйте снова.',
            429: 'Слишком много попыток. Подождите пару минут и попробуйте снова.',
            500: 'Сервис входа по номеру временно недоступен. Попробуйте позже.',
            502: 'Сервис входа по номеру временно недоступен. Попробуйте через минуту.',
            503: 'Сервис входа по номеру временно недоступен. Попробуйте через минуту.',
            504: 'Сервер не успел ответить. Попробуйте ещё раз.'
        };

        function errorStatus(err) {
            if (!err || typeof err !== 'object') return 0;
            return Number(err.status) || 0;
        }

        function rawErrorText(err) {
            if (!err) return '';
            if (typeof err === 'string') return err;
            if (err.data) {
                return String(err.data.message || err.data.error || '');
            }
            return String(err.message || '');
        }

        // Текст считаем годным для показа, только если он на русском:
        // технические строки вида "Network error" или "undefined" не помогают.
        function isHumanText(text) {
            return !!text && /[а-яё]/i.test(text);
        }

        function friendlyError(code, err) {
            var status = errorStatus(err);
            var raw = rawErrorText(err);

            if (status === 0 && !isHumanText(raw)) {
                return 'Нет связи с сервером. Проверьте подключение к интернету и попробуйте снова.';
            }
            if (isHumanText(raw)) {
                return raw;
            }
            if (ERROR_BY_STATUS[status]) {
                return ERROR_BY_STATUS[status];
            }
            if (status >= 500) {
                return ERROR_BY_STATUS[500];
            }
            return ERROR_BY_CODE[code] || 'Не удалось подтвердить номер. Попробуйте ещё раз.';
        }

        function reportError(code, err, btn, btnLabel) {
            // SDK сначала эмитит событие error, а затем реджектит промис —
            // без этого флага пользователь получил бы два одинаковых сообщения.
            if (errorReported) return;
            errorReported = true;
            clearPendingTimer();
            if (btn) {
                setLoading(btn, false, btnLabel);
            }
            var message = friendlyError(code, err);
            showStatus(message, 'error');
            postToApp({
                type: 'error',
                code: code,
                message: rawErrorText(err) || message,
                userMessage: message,
                status: errorStatus(err)
            });
        }

        function setLoading(btn, loading, label) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span>' + (label || 'Подождите...');
            } else {
                btn.disabled = false;
                btn.textContent = label;
            }
        }

        // Мост в React Native WebView (если страница открыта внутри приложения)
        function postToApp(payload) {
            try {
                if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                    window.ReactNativeWebView.postMessage(JSON.stringify(payload));
                }
            } catch (e) { /* no-op */ }
        }

        function clearPendingTimer() {
            if (pendingTimer) {
                clearInterval(pendingTimer);
                pendingTimer = null;
            }
        }

        function startPendingHints() {
            clearPendingTimer();
            pendingStartedAt = Date.now();
            postToApp({ type: 'status', phase: 'pending', message: 'Запуск проверки номера...' });

            pendingTimer = setInterval(function () {
                var sec = Math.floor((Date.now() - pendingStartedAt) / 1000);
                var message = '';

                if (sec < 20) {
                    message = 'Проверяем номер. Если вы на Wi‑Fi — включите мобильный интернет (4G/5G).';
                } else if (sec < 45) {
                    message = 'Ожидаем подтверждение на телефоне (SIM‑PUSH). Нажмите «Принять» во всплывающем окне.';
                } else if (sec < 90) {
                    message = 'Отправляем SMS с кодом. Обычно приходит в течение минуты.';
                } else {
                    message = 'Код не пришёл? Отключите Wi‑Fi, включите мобильный интернет и попробуйте снова. Проверьте, что номер совпадает с SIM в телефоне.';
                    postToApp({ type: 'pending_timeout', seconds: sec });
                }

                showStatus(message, sec >= 90 ? 'error' : 'info');
                postToApp({ type: 'status', phase: 'pending', seconds: sec, message: message });
            }, 5000);
        }

        // Форматирование номера в +7 (XXX) XXX-XX-XX
        function formatPhone(text) {
            var digits = (text || '').replace(/\D/g, '');
            if (digits.startsWith('8')) digits = '7' + digits.slice(1);
            if (digits.length && !digits.startsWith('7')) digits = '7' + digits;
            digits = digits.slice(0, 11);
            var out = '';
            if (digits.length > 0) out = '+7';
            if (digits.length > 1) out += ' (' + digits.slice(1, 4);
            if (digits.length >= 4) out += ')';
            if (digits.length > 4) out += ' ' + digits.slice(4, 7);
            if (digits.length > 7) out += '-' + digits.slice(7, 9);
            if (digits.length > 9) out += '-' + digits.slice(9, 11);
            return out;
        }

        els.phone.addEventListener('input', function () {
            els.phone.value = formatPhone(els.phone.value);
            var digits = els.phone.value.replace(/\D/g, '');
            els.startBtn.disabled = digits.length !== 11;
        });

        // Номер может прийти из приложения: ?phone=%2B79161234567&lock=1.
        // lock=1 нужен при регистрации — там номер уже введён в форме,
        // и он должен совпасть с подтверждённым.
        (function applyPhonePrefill() {
            var prefill = params_get('phone');
            if (!prefill) return;

            els.phone.value = formatPhone(prefill);
            var digits = els.phone.value.replace(/\D/g, '');
            els.startBtn.disabled = digits.length !== 11;

            if (digits.length === 11 && params_get('lock') === '1') {
                els.phone.readOnly = true;
            }
        })();

        function init() {
            if (typeof MobileID === 'undefined') {
                showStatus('Модуль авторизации недоступен.', 'error');
                return;
            }

            // tokenUrl — эндпоинт нашего backend. Относительный путь работает,
            // если /api проксируется на этот же домен (api-iceberg.ru).
            var tokenUrl = params_tokenUrl();

            mid = new MobileID({ tokenUrl: tokenUrl });

            mid.on('ready', function () {
                showStatus('');
                postToApp({ type: 'status', phase: 'ready' });
            });
            mid.on('pending', function () {
                startPendingHints();
            });
            mid.on('otp_required', function () {
                clearPendingTimer();
                errorReported = false;
                els.phoneStep.classList.add('hidden');
                els.otpStep.classList.remove('hidden');
                setLoading(els.startBtn, false, 'Подтвердить');
                showStatus('Мы отправили код в SMS. Введите 4 цифры.', 'info');
                postToApp({ type: 'status', phase: 'otp_required', message: 'Введите код из SMS' });
                els.otp.focus();
            });
            mid.on('invalid_code', function () {
                setLoading(els.otpBtn, false, 'Подтвердить код');
                showStatus('Неверный код. Попробуйте ещё раз.', 'error');
            });
            mid.on('verified', function (data) {
                showStatus('Номер подтверждён!', 'info');
                postToApp({
                    type: 'verified',
                    session_id: mid.getSessionId ? mid.getSessionId() : (data && data.session_id),
                    verify_token: data && data.verify_token,
                    phone: mid.getPhone ? mid.getPhone() : currentPhone,
                });
            });
            mid.on('rejected', function () {
                clearPendingTimer();
                setLoading(els.startBtn, false, 'Подтвердить');
                setLoading(els.otpBtn, false, 'Подтвердить код');
                showStatus('Авторизация отклонена. Попробуйте снова.', 'error');
                postToApp({ type: 'rejected' });
                resetToPhone();
            });
            mid.on('expired', function () {
                clearPendingTimer();
                setLoading(els.startBtn, false, 'Подтвердить');
                setLoading(els.otpBtn, false, 'Подтвердить код');
                showStatus('Время вышло. Начните заново.', 'error');
                postToApp({ type: 'expired' });
                resetToPhone();
            });
            mid.on('error', function (err) {
                setLoading(els.otpBtn, false, 'Подтвердить код');
                reportError((err && err.code) || 'START_FAILED', err, els.startBtn, 'Подтвердить');
            });
        }

        function params_tokenUrl() {
            return params_get('tokenUrl') || '/api/auth/mobileid/token';
        }
        function params_get(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        function resetToPhone() {
            els.otpStep.classList.add('hidden');
            els.phoneStep.classList.remove('hidden');
            els.otp.value = '';
        }

        els.startBtn.addEventListener('click', async function () {
            if (!mid) return;
            currentPhone = els.phone.value;
            errorReported = false;
            setLoading(els.startBtn, true, 'Проверяем...');
            showStatus('');
            try {
                await mid.init();
                await mid.start(currentPhone);
            } catch (e) {
                reportError('START_EXCEPTION', e, els.startBtn, 'Подтвердить');
            }
        });

        els.otpBtn.addEventListener('click', async function () {
            if (!mid) return;
            var code = (els.otp.value || '').replace(/\D/g, '');
            if (code.length < 4) {
                showStatus('Введите код полностью.', 'error');
                return;
            }
            errorReported = false;
            setLoading(els.otpBtn, true, 'Проверяем...');
            showStatus('');
            try {
                await mid.submitOTP(code);
            } catch (e) {
                reportError('OTP_FAILED', e, els.otpBtn, 'Подтвердить код');
            }
        });
    </script>
</body>
</html>
